name: 🐞 Bug report
description: Report a reproducible bug in the District AI Android app (not an account question or a feature request).
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Before you start, please [search existing issues](https://github.com/distronode-corporation/district-android/issues?q=is%3Aissue).** It may already be reported or fixed.

        ⛔ **Do not report a security vulnerability here.** Report it privately through [Report a vulnerability](https://github.com/distronode-corporation/district-android/security/advisories/new) instead; see [SECURITY.md](https://github.com/distronode-corporation/district-android/blob/main/SECURITY.md).

        ⚠️ **Nothing you paste here is private.** Do not include names, phone numbers, email addresses, message or transcript content, or screenshots from a real workspace. Redact anything you would not publish.
  - type: checkboxes
    id: prechecks
    attributes:
      label: Before submitting
      options:
        - label: I've searched existing issues and this isn't a duplicate.
          required: true
        - label: I'm on the latest release (1.0 on Google Play) or a build of `main`.
          required: true
        - label: This is not a security issue (those go to [Report a vulnerability](https://github.com/distronode-corporation/district-android/security/advisories/new)).
          required: true
        - label: I've removed every token and every piece of customer or caller data from what I'm pasting.
          required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What's the bug?
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Exact steps, so a maintainer can reproduce it.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      description: "Android Settings > Apps > District AI shows the version. For a build from source, the commit you built."
      placeholder: "1.0"
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How did you install it?
      options:
        - Google Play
        - Built from source (debug)
        - Built from source (release)
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and Android version
      placeholder: Pixel 8, Android 16
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Where does it go wrong?
      options:
        - Sign-in
        - Calls, the dialler or an incoming call
        - Inbox and messages
        - Contacts
        - Rooms
        - Notifications
        - Settings
        - Something else
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: "Relevant `adb logcat` output, if you have it. Read it before pasting: it can contain phone numbers and message text."
      render: text

name: Dependency review

# Pull requests only: fails a pull request that ADDS a dependency with a known moderate-or-worse
# vulnerability, or under a licence this Apache-2.0 project cannot ship. Mostly a guard on
# Dependabot's own pull requests. The same action, pin and deny-list as district-macos's
# dependency-review.yml and the `dependency-review` jobs of bridgewatch and district-linux.
#
# ⛔ FOR GRADLE IT DEPENDS ON dependency-submission.yml. GitHub's dependency graph reads no Gradle
# file, so a pull request's Gradle dependencies exist for this review only once that workflow has
# submitted them for the head commit, which it does for pull requests from this repository. The
# two workflows start together, so this one waits for the snapshot (`retry-on-snapshot-warnings`)
# for up to ten minutes, the timeout gradle/actions documents for this pairing; a submission
# takes about one to three minutes. A pull request from a fork gets no submission, so it does
# not wait for one.
#
# It compares the two sides through the dependency graph API, so it checks nothing out.
on:
  pull_request:

permissions:
  contents: read

# Per pull request; a newer push supersedes the run in flight.
concurrency:
  group: dependency-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: dependency-review
    # Dependency review on a private repository needs GitHub Code Security, so it would fail every
    # pull request there; skipped like dependency-submission.yml.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          deny-licenses: GPL-2.0-only, GPL-2.0-or-later, GPL-3.0-only, GPL-3.0-or-later, AGPL-3.0-only, AGPL-3.0-or-later, LGPL-2.1-only, LGPL-2.1-or-later, LGPL-3.0-only, LGPL-3.0-or-later, SSPL-1.0, BUSL-1.1
          retry-on-snapshot-warnings: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          retry-on-snapshot-warnings-timeout: 600

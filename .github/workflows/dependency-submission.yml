name: Dependency submission

# ⛔ WITHOUT THIS WORKFLOW, DEPENDABOT ALERTS COVER NO GRADLE DEPENDENCY AT ALL. GitHub's
# dependency graph reads no Gradle file: not build.gradle.kts, not the version catalog, not the
# gradle.lockfile of any module. The only way Gradle dependencies reach the graph is through the
# dependency submission API, and so "0 Dependabot alerts" would otherwise mean "nothing was
# looked at", not "nothing is vulnerable".
#
# gradle/actions/dependency-submission runs the build with the GitHub Dependency Graph Gradle
# Plugin injected, resolves every configuration of every project (the app's and each core
# module's compile and runtime classpaths, their test classpaths, AGP's lint classpath and the
# build-logic plugin classpath), and submits the result for the commit it ran on. It compiles
# nothing and runs no tests. Nothing is filtered out: the lockfiles hold test and lint-tool
# coordinates too (see "Forced patch versions for build-only CVEs" in build.gradle.kts), and a
# vulnerable build-only dependency is still worth an alert.
#
# ⚠️ The Gradle plugin classpaths are in the graph as well: the root build's buildscript
# `classpath` and build-logic's configurations. Neither is locked, and AGP 9.4.1 brings
# bouncycastle 1.80.2 onto both, so each carries its own force to the catalog's `bouncyCastle`
# version, 1.86 (the top of build.gradle.kts, and build-logic/convention/build.gradle.kts).
# Measured with this action's own init scripts when that version was 1.85: no org.bouncycastle
# below 1.85 anywhere in the graph. A new plugin that
# drags in an older version of something is reported the same way, so keep those forces in step.
#
# ⚠️ THIS WORKFLOW IS THE ONE SUBMITTER. GitHub's "Automatic dependency submission" (a repository
# code security setting, not a file) also submits a Gradle graph, from a build it sets up itself
# rather than the one described here. Keep that setting OFF: two submitters mean two graphs for one
# commit, and duplicated or disagreeing alerts.
#
# ⚠️ ON A PULL REQUEST IT ALSO REVIEWS THE DEPENDENCY CHANGES (job `review`). The review compares
# the graph of the pull request's head commit with its base, and for Gradle the head commit has a
# graph only if `submit` filed one (the action files it under the pull request's head SHA, not the
# merge commit). `submit` runs for pull requests from this repository only: a fork's token cannot
# get `contents: write`. A fork's review has no Gradle graph for its head commit, so it can judge
# only what GitHub reads by itself (the workflows' actions).
#
# ⛔ THE REVIEW IS A JOB HERE WITH `needs: submit`, NOT A SEPARATE WORKFLOW. In its own workflow
# it starts beside the submission, and its first query finds no snapshot. Its retries
# (`retry-on-snapshot-warnings`) then never see the snapshot that lands while it waits, a known
# bug (actions/dependency-review-action#632); a re-run sees it at once. Measured on pull request
# #36: two runs waited out 10 and 25 minutes and passed WITHOUT the Gradle graph, which is a gate
# that looks green without having looked. Ordered after the submission, its first query has the
# snapshot. A run whose log still ends in "Retry timeout exceeded" has NOT reviewed Gradle:
# re-run that job.
#
# Action pins follow ci.yml: allowlisted, full commit SHA, `# vX.Y.Z` naming that SHA's version.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Nothing at the top level; each job below asks for the one scope it needs.
permissions: {}

# Only the newest commit's graph matters, so a newer push cancels an older submission that is
# still in flight (per ref: main, or one pull request).
concurrency:
  group: dependency-submission-${{ github.ref }}
  cancel-in-progress: true

jobs:
  submit:
    name: Submit Gradle dependencies
    # ⛔ SKIPPED WHILE THE REPOSITORY IS PRIVATE, like the analysis in codeql.yml: the graph it
    # feeds drives Dependabot alerts on the public repository, and there is nothing to gain from
    # running it before then. Once the repository is public it runs on every push to main, and on
    # every pull request whose branch is in this repository (never a fork's, see the top).
    if: >-
      ${{ !github.event.repository.private &&
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Nothing else here writes.
    permissions:
      contents: write # the dependency submission API requires it
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The submission uses the action's own `github-token` input, not .git/config.
          persist-credentials: false

      # JDK 21, as in ci.yml. AGP 9 needs a JDK of at least 17 to run at all.
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      # Same SDK step as ci.yml, for the same reason: resolving the Android configurations runs
      # AGP's configuration phase, and a missing package should fail here, by name, rather than
      # be left to AGP's on-demand download.
      - name: Android SDK platform and build tools
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "platforms;android-37.0" "build-tools;37.0.0" > /dev/null
          test -d "$ANDROID_HOME/platforms/android-37.0"
          test -d "$ANDROID_HOME/build-tools/37.0.0"

      # The same gradle/actions release as ci.yml's setup-gradle. This action does the
      # setup-gradle work itself, so the two inputs that ci.yml relies on are spelled out:
      #
      # ⚠️ `cache-provider: basic`, for the licensing reason given in ci.yml.
      # ⚠️ `validate-wrappers: true`. setup-gradle checks gradle-wrapper.jar against Gradle's
      #   published checksums by default; this action does NOT (its default is false), and it
      #   executes the wrapper, so the check is turned on here.
      #
      # `generate-and-submit` sends the graph to the API and skips the default extra copy as a
      # workflow artifact, which nothing reads.
      - uses: gradle/actions/dependency-submission@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
          validate-wrappers: true
          dependency-graph: generate-and-submit

  # Pull requests only: fails a pull request that ADDS a dependency with a known moderate-or-worse
  # vulnerability, or under a licence this Apache-2.0 project cannot ship. Mostly a guard on
  # Dependabot's own pull requests. The same action, pin and deny-list as district-macos's
  # dependency-review.yml and the `dependency-review` jobs of bridgewatch and district-linux. It
  # compares the two sides through the dependency graph API, so it checks nothing out.
  review:
    name: dependency-review
    needs: submit
    # After `submit` on a pull request from this repository, and with `submit` skipped on a fork's.
    # Not after a failed or cancelled submission: that review would pass without the Gradle graph.
    # Skipped while the repository is private, where dependency review needs GitHub Code Security.
    if: >-
      ${{ !cancelled() && github.event_name == 'pull_request' &&
      !github.event.repository.private &&
      (needs.submit.result == 'success' || needs.submit.result == 'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # The retry is a backstop for a snapshot GitHub has not finished storing, not the way the
      # two jobs are ordered (see the top). On a fork's pull request no snapshot is coming, so it
      # does not wait.
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          deny-licenses: GPL-2.0-only, GPL-2.0-or-later, GPL-3.0-only, GPL-3.0-or-later, AGPL-3.0-only, AGPL-3.0-or-later, LGPL-2.1-only, LGPL-2.1-or-later, LGPL-3.0-only, LGPL-3.0-or-later, SSPL-1.0, BUSL-1.1
          retry-on-snapshot-warnings: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          retry-on-snapshot-warnings-timeout: 300

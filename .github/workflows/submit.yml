name: Submit for review

# Submits a release that release.yml has already built and uploaded, for Google Play review, with
# the maintainers' explicit approval. Run it from main with the tag to submit.
#
# It builds nothing. It checks out the tag, derives the same versionCode release.yml built
# (scripts/release-version.sh, the same checks), finds that bundle on Google Play, and releases
# it to production with the tag's CHANGELOG section as release notes. Committing that edit is
# what sends a published app's release for review. Re-running it after a partial failure is safe:
# scripts/play-publish.sh does nothing if production already carries the build.
#
# Same rules as release.yml: the `release` environment and workload identity for credentials,
# no pull_request trigger, inputs reach shell only through `env:`.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "The release tag to submit, for example v1.1."
        type: string
        required: true
      approval:
        description: "Maintainers' approval to submit for review."
        type: string
        required: true

permissions: {}

# Shared with release.yml's submit job, so the same tag is never submitted twice at once.
concurrency:
  group: play-submit-${{ inputs.tag }}
  cancel-in-progress: false

env:
  WORKLOAD_IDENTITY_PROVIDER: projects/409911651910/locations/global/workloadIdentityPools/github-pool/providers/github-actions
  RELEASE_SERVICE_ACCOUNT: gh-android-release@distronode.iam.gserviceaccount.com

jobs:
  submit:
    name: Submit for review (production)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release
    permissions:
      contents: read
      id-token: write # workload identity federation to Google Cloud
    steps:
      # First, before anything is checked out or any credential is minted.
      - name: Approval
        env:
          APPROVAL: ${{ inputs.approval }}
        run: |
          if [ "$APPROVAL" != "approved for release" ]; then
            echo "::error::No submission was made: this workflow submits only with the maintainers' explicit approval."
            echo "No submission was made: the approval input was not given." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Tag format
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+(\.[0-9]+){0,2}$'; then
            echo "::error::'$TAG' is not a release tag (v1.1, v1.1.2). No submission was made."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: refs/tags/${{ inputs.tag }}
          # The whole history: the versionCode is derived from the commit count, and the tag is
          # checked against main.
          fetch-depth: 0

      - name: Version and ref checks
        id: version
        env:
          TAG: ${{ inputs.tag }}
        run: |
          scripts/release-version.sh --tag "$TAG" >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

      - name: Release notes
        env:
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
        # To a file first, then shown: a pipe into tee would hide a failure, because a step without
        # `shell:` runs bash without pipefail.
        run: |
          scripts/release-notes.sh "$VERSION_NAME" > "$RUNNER_TEMP/release-notes.txt"
          cat "$RUNNER_TEMP/release-notes.txt"

      - id: gcp
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.RELEASE_SERVICE_ACCOUNT }}
          token_format: access_token
          create_credentials_file: false
          export_environment_variables: false

      - name: Submit to production
        env:
          GCP_TOKEN: ${{ steps.gcp.outputs.access_token }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
        run: scripts/play-publish.sh submit "$VERSION_CODE" "$VERSION_NAME" "$RUNNER_TEMP/release-notes.txt"

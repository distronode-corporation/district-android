name: Submit for review

# Submits a release that release.yml has already built and uploaded, for Google Play review, with
# the maintainers' explicit approval. Run it from main with the tag to submit.
#
# It builds nothing. It checks out the tag, derives the same versionCode release.yml built
# (scripts/release-version.sh, the same checks), finds that bundle on Google Play, and releases
# it to production with the tag's CHANGELOG section as release notes. Committing that edit is
# what sends a published app's release for review. Then, and only once that has succeeded, the
# `github-release` job publishes the tag's GitHub Release (scripts/github-release.sh). Re-running
# it after a partial failure is safe: scripts/play-publish.sh does nothing if production already
# carries the build, and scripts/github-release.sh does nothing if the release already exists.
#
# Same rules as release.yml: the `release` environment and workload identity for credentials,
# no pull_request trigger, inputs reach shell only through `env:`.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "The release tag to submit, for example v1.1."
        type: string
        required: true
      approval:
        description: "Maintainers' approval to submit for review."
        type: string
        required: true

permissions: {}

# Shared with release.yml's submit job, so the same tag is never submitted twice at once.
concurrency:
  group: play-submit-${{ inputs.tag }}
  cancel-in-progress: false

env:
  WORKLOAD_IDENTITY_PROVIDER: projects/409911651910/locations/global/workloadIdentityPools/github-pool/providers/github-actions
  RELEASE_SERVICE_ACCOUNT: gh-android-release@distronode.iam.gserviceaccount.com

jobs:
  submit:
    name: Submit for review (production)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release
    permissions:
      contents: read
      id-token: write # workload identity federation to Google Cloud
    outputs:
      version_code: ${{ steps.version.outputs.version_code }}
    steps:
      # First, before anything is checked out or any credential is minted.
      - name: Approval
        env:
          APPROVAL: ${{ inputs.approval }}
        run: |
          if [ "$APPROVAL" != "approved for release" ]; then
            echo "::error::No submission was made: this workflow submits only with the maintainers' explicit approval."
            echo "No submission was made: the approval input was not given." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Tag format
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+(\.[0-9]+){0,2}$'; then
            echo "::error::'$TAG' is not a release tag (v1.1, v1.1.2). No submission was made."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: refs/tags/${{ inputs.tag }}
          # The whole history: the versionCode is derived from the commit count, and the tag is
          # checked against main.
          fetch-depth: 0

      - name: Version and ref checks
        id: version
        env:
          TAG: ${{ inputs.tag }}
        run: |
          scripts/release-version.sh --tag "$TAG" >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

      # Release notes, a fresh Play token and the production submit: one copy, shared with
      # release.yml's `submit` job.
      #
      # ⛔ THE SUBMIT ACTION COMES FROM THIS WORKFLOW'S COMMIT, NOT FROM THE TAG. The workspace
      # above is the tag, which may predate .github/actions/play-submit (v1.0 and v1.1 do), so a
      # workspace-relative `./` reference cannot be used here. GitHub's self-repository syntax,
      # `$/...`, resolves to this repository at the commit this workflow runs from, with no
      # checkout; the scripts the action runs still come from the workspace, which is the tag.
      - name: Submit to production
        uses: $/.github/actions/play-submit
        with:
          version-code: ${{ steps.version.outputs.version_code }}
          version-name: ${{ steps.version.outputs.version_name }}
          workload-identity-provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service-account: ${{ env.RELEASE_SERVICE_ACCOUNT }}

  # The tag's GitHub Release, only after the production submit above succeeded. Its own job, so
  # the one token that can write to the repository never shares a job with the Google Cloud
  # credential, and the submit job keeps its read-only token.
  github-release:
    name: GitHub Release
    needs: submit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # publish the release
      actions: read # find the release.yml run that built the tag
    steps:
      # ⛔ THE SCRIPT COMES FROM THIS WORKFLOW'S COMMIT, THE CHANGELOG FROM THE TAG. The tag may
      # predate scripts/github-release.sh (v1.2 and earlier do), and the release notes are the
      # tag's own CHANGELOG section, the same text submitted to Play.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          sparse-checkout: scripts

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: refs/tags/${{ inputs.tag }}
          path: .tag
          sparse-checkout: CHANGELOG.md
          sparse-checkout-cone-mode: false

      # The build run is release.yml's successful push run for the tag, the one whose upload Play
      # holds. If there is none, the release names only this run rather than guess.
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          CHANGELOG: .tag/CHANGELOG.md
          TAG: ${{ inputs.tag }}
          VERSION_CODE: ${{ needs.submit.outputs.version_code }}
          SUBMIT_RUN: ${{ github.run_id }}
        run: |
          build_run=$(scripts/github-release.sh build-run "$TAG")
          scripts/github-release.sh publish "$TAG" "$VERSION_CODE" "$SUBMIT_RUN" "$build_run"

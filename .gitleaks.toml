# gitleaks configuration: the default rules, plus allowlists for the values in this repository
# that look like secrets and are not. SECURITY.md explains each one.
#
# ⛔ EVERY ALLOWLIST IS SCOPED TO ONE RULE, NAMED FILES AND THE EXACT VALUES, with
# `condition = "AND"`. A path-only allowlist would also hide a real secret pasted into the
# same file later, which is exactly the file a reviewer would not think to check again.
#
# ⚠️ Paths are matched with `(^|/)` rather than `^` because `gitleaks dir <path>` reports them
# with the scanned directory in front, while `gitleaks git` reports them repository-relative.

[extend]
useDefault = true

# The Firebase Android API key. Client configuration that ships in every APK; it identifies the
# Firebase project to Google's client SDKs and grants nothing on its own.
[[allowlists]]
description = "Firebase client API key (public client configuration)"
targetRules = ["gcp-api-key"]
condition = "AND"
paths = ['''(^|/)app/src/main/kotlin/com/distronode/districtai/push/DistrictFirebase\.kt$''']
regexTarget = "secret"
regexes = ['''^AIzaSyCfxucS4K_z-HppqEpbamLC-zTMh3AY4_A$''']

# LiveKit end-to-end-encryption keys generated by the server's contract test suite from fixed
# test inputs, and the unit tests that decode them. They protect no real room.
[[allowlists]]
description = "LiveKit E2EE keys in contract fixtures and tests (test data)"
targetRules = ["generic-api-key"]
condition = "AND"
paths = [
  '''(^|/)contracts/district-(room-token|room-token-viewer|persona-preview-token)\.json$''',
  '''(^|/)app/src/test/kotlin/com/distronode/districtai/ui/rooms/ActiveRoomViewModelTest\.kt$''',
  '''(^|/)app/src/test/kotlin/com/distronode/districtai/ui/settings/workspace/PersonaPreviewViewModelTest\.kt$''',
  '''(^|/)core/core-data/src/test/kotlin/com/distronode/districtai/core/data/PersonaOptionsRepositoryTest\.kt$''',
  '''(^|/)core/core-media/src/test/kotlin/com/distronode/districtai/core/media/CallEngineModelsTest\.kt$''',
  '''(^|/)core/core-media/src/test/kotlin/com/distronode/districtai/core/media/LiveKitCallEngineTest\.kt$''',
]
regexTarget = "secret"
regexes = [
  '''^cUwBK6pBSbabCBfQZ8VZW\+bW5dOg2dwb3JG8q7E4Jc4=$''',
  '''^YfxKDUkaaGp2WrLLGHCHbe2nn5ArCWBd\+x\+k7EzDr/8=$''',
  '''^CgAZ6Mja5niqpHLjUH0iEwcJVPHbcGBtE51R056G4OE=$''',
]

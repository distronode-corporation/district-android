# ⚠️ A MODEST HEAP, DELIBERATELY. The daemon gets enough to build this project
# comfortably on a laptop without starving the editor and the Kotlin daemon beside it;
# a machine with room to spare can raise -Xmx in its own ~/.gradle/gradle.properties.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# AndroidX is the only support library lineage this project uses.
android.useAndroidX=true

# Kotlin
kotlin.code.style=official

# ⛔ Do NOT enable android.nonFinalResIds or resource shrinking experiments here
# without checking the release build; R8 rules are verified against the release
# artifact, and a debug-only change that breaks release is invisible until then.

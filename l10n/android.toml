[meta]
catalog = "android"
platform = "android"

[analytics.delta_counts]
en = "{current} now, {previous} in the previous period"
fr = "{current} pour cette période, {previous} pour la précédente"
ctx = "label"
screen = "analytics"
tier = "T3"
args = { current = "int", previous = "int" }
state = "reviewed"
note = "Call-volume delta against the immediately preceding window of the same length."

[analytics.delta_down]
en = "▼ {percent}% vs the previous period"
fr = "▼ {percent}\u00A0% par rapport à la période précédente"
ctx = "label"
screen = "analytics"
tier = "T3"
args = { percent = "int" }
state = "reviewed"
note = "Call-volume delta against the immediately preceding window of the same length."

[analytics.delta_flat]
en = "No change vs the previous period"
fr = "Aucun changement par rapport à la période précédente"
ctx = "label"
screen = "analytics"
tier = "T3"
state = "reviewed"
note = "Call-volume delta against the immediately preceding window of the same length."

[analytics.delta_new]
en = "New — no previous period to compare"
fr = "Nouveau\u00A0: aucune période précédente à comparer"
ctx = "label"
screen = "analytics"
tier = "T3"
state = "reviewed"
note = "Call-volume delta against the immediately preceding window of the same length. ⛔ \"New\", NOT \"0%\". A null pct means there is no prior period to compare against, so no percentage exists. Rendering it as zero tells a brand-new customer their volume is flat during their first week."

[analytics.delta_title]
en = "Call volume"
fr = "Volume d'appels"
ctx = "title"
screen = "analytics"
tier = "T3"
state = "reviewed"
note = "Call-volume delta against the immediately preceding window of the same length."

[analytics.delta_up]
en = "▲ {percent}% vs the previous period"
fr = "▲ {percent}\u00A0% par rapport à la période précédente"
ctx = "label"
screen = "analytics"
tier = "T3"
args = { percent = "int" }
state = "reviewed"
note = "Call-volume delta against the immediately preceding window of the same length."

[analytics.failed]
en = "Could not load analytics."
fr = "Impossible de charger l'analytique."
ctx = "error"
screen = "analytics"
tier = "T2"
state = "reviewed"

[analytics.funnel_title]

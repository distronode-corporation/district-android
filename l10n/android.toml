[meta]
catalog = "android"
platform = "android"

[analytics.delta_counts]
en = "{current} now, {previous} in the previous period"
ctx = "label"
screen = "analytics"
tier = "T3"
args = { current = "int", previous = "int" }
note = "Call-volume delta against the immediately preceding window of the same length."

[analytics.delta_down]
en = "▼ {percent}% vs the previous period"
ctx = "label"
screen = "analytics"
tier = "T3"
args = { percent = "int" }
note = "Call-volume delta against the immediately preceding window of the same length."

[analytics.delta_flat]
en = "No change vs the previous period"
ctx = "label"
screen = "analytics"
tier = "T3"
note = "Call-volume delta against the immediately preceding window of the same length."

[analytics.delta_new]
en = "New — no previous period to compare"
ctx = "label"
screen = "analytics"
tier = "T3"
note = "Call-volume delta against the immediately preceding window of the same length. ⛔ \"New\", NOT \"0%\". A null pct means there is no prior period to compare against, so no percentage exists. Rendering it as zero tells a brand-new customer their volume is flat during their first week."

[analytics.delta_title]
en = "Call volume"
ctx = "title"
screen = "analytics"
tier = "T3"
note = "Call-volume delta against the immediately preceding window of the same length."

[analytics.delta_up]
en = "▲ {percent}% vs the previous period"
ctx = "label"
screen = "analytics"
tier = "T3"
args = { percent = "int" }
note = "Call-volume delta against the immediately preceding window of the same length."

[analytics.failed]
en = "Could not load analytics."
ctx = "error"
screen = "analytics"
tier = "T2"

[analytics.funnel_title]
en = "Conversion funnel"
ctx = "title"
screen = "analytics"
tier = "T3"

[analytics.history_absent]
en = "—"
ctx = "label"
screen = "analytics"
tier = "T3"
note = "Metered usage over recent months, the web console's three-month trend. ⛔ The dash is what an ABSENT metric renders as. A metric with no rows has no key on the wire, which is not the same fact as one measured at zero, and a zero under a billing label is the one that gets believed."

[analytics.history_caption]
en = "Bars compare metered call minutes across these months. A dash means nothing was metered for that channel."
ctx = "body"
screen = "analytics"
tier = "T3"
note = "Metered usage over recent months, the web console's three-month trend."

[analytics.history_failed]
en = "Could not load usage history."
ctx = "error"
screen = "analytics"
tier = "T2"
note = "Metered usage over recent months, the web console's three-month trend."

[analytics.history_messages]
en = "Messages"
ctx = "label"
screen = "analytics"
tier = "T3"
note = "Metered usage over recent months, the web console's three-month trend."

[analytics.history_minutes]
en = "Metered call minutes"
ctx = "label"
screen = "analytics"
tier = "T3"
note = "Metered usage over recent months, the web console's three-month trend. ⚠️ Says METERED because an absent direction contributes nothing to the total rather than being asserted to have been zero. See sumMetered."

[analytics.history_none]
en = "No usage has been recorded in any recent month yet."
ctx = "label"
screen = "analytics"
tier = "T3"
note = "Metered usage over recent months, the web console's three-month trend. ⛔ \"Nothing recorded\", NOT three rows of zeros. The server appends only months that had metering rows, so an empty list means this workspace has never been metered at all, which is a different claim from \"you used nothing in those months\"."

[analytics.history_title]
en = "Recent months"
ctx = "title"
screen = "analytics"
tier = "T3"
note = "Metered usage over recent months, the web console's three-month trend."


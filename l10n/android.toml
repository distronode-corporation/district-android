screen = "analytics"
tier = "T3"
state = "reviewed"
note = "Metered usage over recent months, the web console's three-month trend. ⛔ \"Nothing recorded\", NOT three rows of zeros. The server appends only months that had metering rows, so an empty list means this workspace has never been metered at all, which is a different claim from \"you used nothing in those months\"."


ctx = "label"
screen = "billing"
tier = "T1"
args = { minutes = "str", included = "int" }
note = "⚠️ The real numbers, even past the allowance. The BAR clamps; this label must not."

[billing.open]
en = "Billing"
ctx = "button"
screen = "overview"
tier = "T1"
note = "══ Billing (read-only) ══════════════════════════════════════════════ ⛔ THERE IS NO PURCHASE, UPGRADE, CANCEL OR PAYMENT COPY IN THIS SECTION AND THERE MUST NOT BE. Google Play's Payments policy prohibits an in-app route to a purchase for this kind of subscription, so the screen states what is being billed and names the website in prose, never as a tappable link into a checkout."

[billing.overage_auto_bill]
en = "Extra minutes beyond your plan are billed automatically."
ctx = "label"
screen = "billing"
tier = "T1"

[billing.overage_blocked]
en = "Calls are being declined — your included minutes are used up"
ctx = "label"
screen = "billing"
tier = "T1"
note = "⛔ TWO SENTENCES FOR ONE FLAG, AND THE DIFFERENCE IS AN OUTAGE. Under a hard cap an exceeded allowance means calls are being REFUSED right now, which the operator has no other way to learn from this app; under auto-bill it is a charge."

[billing.overage_exceeded]
en = "Over your included minutes — the extra is being billed"
ctx = "label"
screen = "billing"
tier = "T1"

[billing.overage_hard_cap]
en = "Calls stop once your included minutes run out."
ctx = "label"
screen = "billing"
tier = "T1"

[billing.overage_title]
en = "Going over your minutes"
ctx = "title"
screen = "billing"
tier = "T1"

[billing.plan_none]
en = "No plan on this workspace"
ctx = "label"
screen = "billing"
tier = "T1"
note = "⛔ NOT \"Free\". subscriptionTier is nullable and this route passes null through untouched; GET /api/settings substitutes a capitalised \"Free\" and this one deliberately does not. Inventing the word would put a plan name on screen that no database row contains."

[billing.plan_title]
en = "Plan"
ctx = "title"
screen = "billing"
tier = "T1"
note = "Section heading on Billing: the workspace's subscription plan."

[billing.read_only]
en = "Plan changes, payment methods and cancellations are not available in this app. This screen is read-only."
ctx = "body"
screen = "billing"
tier = "T1"
note = "⛔ THE CAPTION THAT MAKES THE ABSENCE OF CONTROLS DELIBERATE, and it is a store requirement rather than a courtesy. ⛔ It links nowhere and names nowhere: App Store Guideline 3.1.1 makes the signpost the offence as much as the button, and this copy is the iOS client's `BillingCopy.readOnly` word for word."

[billing.read_only_viewer]
en = "This screen is read-only. Ask an agency or client member of this workspace to change the plan."
ctx = "body"
screen = "billing"
tier = "T1"
note = "⛔ THE CAPTION THAT MAKES THE ABSENCE OF CONTROLS DELIBERATE, and it is a store requirement rather than a courtesy. ⛔ It links nowhere and names nowhere: App Store Guideline 3.1.1 makes the signpost the offence as much as the button, and this copy is the iOS client's `BillingCopy.readOnly` word for word. ⚠️ A viewer cannot make the change anywhere else either, so a signpost would be useless advice on top of being steering. They are told who can."

[billing.renews_on]
en = "Renews {date}"
ctx = "label"
screen = "billing"
tier = "T1"
args = { date = "str" }
note = "⛔ SAME DATE, OPPOSITE MEANING, chosen by cancel_at_period_end. Telling someone who cancelled that their plan \"renews\" says they are about to be billed again."


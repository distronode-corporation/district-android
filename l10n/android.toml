[devices.last_active]
en = "Last active {when}"
fr = "Dernière activité\u00A0: {when}"
ctx = "label"
screen = "devices"
tier = "T2"
args = { when = "str" }
state = "reviewed"
note = "── Devices ───────────────────────────────────────────────────────────── The read half of device management. Until it existed an account holding live refresh tokens on three phones had no way to SEE them, which made the two revoke routes unusable: a deviceId is client-generated and opaque, so this list is the only place a user learns which ids exist. \"Last active\", never \"last used\". The server stamps lastUsedAt only when a refresh token ROTATES, so the value trails real use by up to ~10 minutes and stops moving entirely on a device that is signed in but unopened. \"Last used\" would be a claim the data cannot support."

[devices.last_active_never]
en = "Signed in recently"
fr = "Connecté récemment"
ctx = "label"
screen = "devices"
tier = "T2"
state = "reviewed"
note = "── Devices ───────────────────────────────────────────────────────────── The read half of device management. Until it existed an account holding live refresh tokens on three phones had no way to SEE them, which made the two revoke routes unusable: a deviceId is client-generated and opaque, so this list is the only place a user learns which ids exist. A session that has never been refreshed has never been stamped, which is EVERY session for its first ten minutes, including the one the user just created. An empty line there would read as missing data rather than as a new sign-in."

[devices.nothing_revoked]
en = "That device was already signed out. The list has been refreshed."
fr = "Cet appareil était déjà déconnecté. La liste a été actualisée."
ctx = "body"
screen = "devices"
tier = "T2"
state = "reviewed"
note = "── Devices ───────────────────────────────────────────────────────────── The read half of device management. Until it existed an account holding live refresh tokens on three phones had no way to SEE them, which made the two revoke routes unusable: a deviceId is client-generated and opaque, so this list is the only place a user learns which ids exist. revoked:0 is a SUCCESS, not an error. It comes back for a device id the account does not own (the route refuses to be a membership oracle over an opaque id space), for a row another device already revoked, and for a chain that rotated between the list read and the tap. The client cannot tell those apart and neither can the server, so the honest thing to say is that the list has moved on."


note = "── Scheduling ───────────────────────────────────────────────────────── The workspace's booking page: one card, four tenancy states plus the two \"there is no row\" ones. ⛔ NOTHING HERE OFFERS TO BUY ANYTHING. A workspace the feature does not admit gets `scheduling_not_eligible` and no control at all, Google Play's Payments policy is the same shape as the App Store's 3.1.3(b), and a \"contact sales\" line out of a paid product's own settings is a purchase offer wearing a different hat. ⚠️ THE ENABLE BUTTON'S WORDING IS THE SERVER'S DECISION, NOT A ROLE'S. The status route sends `canManage`, and the client draws the button from it rather than re-deriving one from a role string. ⛔ A DIFFERENT LIMIT FROM `scheduling_too_many_attempts` ABOVE, AND THE TWO MUST NOT BE MERGED. That one is five PROVISIONS an hour for the workspace; this is ten HAND-OFFS a minute for the account, and nothing was provisioned. Saying \"scheduling has been enabled several times\" for a budget that was never spent would be a wrong answer, not a vaguer one. ⛔ AND IT EXISTS AT ALL BECAUSE THE SERVER'S OWN TEXT IS UNSHOWABLE HERE. The handoff route's 429 body is `{\"error\":\"rate_limited\",\"message\":\"…\"}`, the human half is in `message`, which the client's error envelope does not model, so the shared mapping (which renders the server's string verbatim) would print `rate_limited` on a customer's phone."


tier = "T1"
note = "⛔ NOT \"0 minutes\". usage is null when the month has no metering rows at all, and a zero beside an allowance asserts, with the authority of a bill, that no calls were made."

[billing.meter_used]
en = "{minutes} minutes used"
ctx = "label"
screen = "billing"
tier = "T1"

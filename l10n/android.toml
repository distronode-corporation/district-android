ctx = "title"
screen = "analytics"
tier = "T3"
state = "reviewed"

[analytics.history_absent]
en = "—"
fr = "-"
ctx = "label"
screen = "analytics"
tier = "T3"
state = "reviewed"
note = "Metered usage over recent months, the web console's three-month trend. ⛔ The dash is what an ABSENT metric renders as. A metric with no rows has no key on the wire, which is not the same fact as one measured at zero, and a zero under a billing label is the one that gets believed."

[analytics.history_caption]
en = "Bars compare metered call minutes across these months. A dash means nothing was metered for that channel."
fr = "Les barres comparent les minutes d'appel mesurées pour ces mois. Un tiret signifie qu'aucune utilisation n'a été mesurée pour ce canal."
ctx = "body"
screen = "analytics"
tier = "T3"
state = "reviewed"
note = "Metered usage over recent months, the web console's three-month trend."

[analytics.history_failed]
en = "Could not load usage history."
fr = "Impossible de charger l'historique d'utilisation."
ctx = "error"
screen = "analytics"
tier = "T2"
state = "reviewed"
note = "Metered usage over recent months, the web console's three-month trend."

[analytics.history_messages]
en = "Messages"
fr = "Messages"
ctx = "label"
screen = "analytics"
tier = "T3"

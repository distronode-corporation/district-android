tier = "T3"
state = "reviewed"
note = "Metered usage over recent months, the web console's three-month trend. ⚠️ Says METERED because an absent direction contributes nothing to the total rather than being asserted to have been zero. See sumMetered."

[analytics.history_none]
en = "No usage has been recorded in any recent month yet."
fr = "Aucune utilisation n'a encore été mesurée ces derniers mois."
